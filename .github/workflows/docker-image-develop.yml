name: Build and Push Docker Image

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: fortune-index-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Variable Substitution
        uses: microsoft/variable-substitution@v1
        with:
          files: './src/main/resources/application.yml,./src/main/resources/application-dev.yml'
        env:
          spring.datasource.username: ${{ secrets.DB_USERNAME }}
          spring.datasource.password: ${{ secrets.DB_PASSWORD }}
          app.auth.jwt.secret: ${{ secrets.JWT_SECRET }}
          spring.mail.username: ${{ secrets.MAIL_FROM_ADDRESS }}
          app.email.verification.from-address: ${{ secrets.MAIL_FROM_ADDRESS }}
          spring.mail.password: ${{ secrets.SMTP_PASSWORD }}
          app.ai.gemini.api-key: ${{ secrets.GEMINI_API_KEY }}
          app.ai.openai.api-key: ${{ secrets.OPENAI_API_KEY }}

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          docker build -t ${IMAGE_NAME}:${IMAGE_TAG} .
          docker tag ${IMAGE_NAME}:${IMAGE_TAG} docker.io/${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:${IMAGE_TAG}
          docker tag ${IMAGE_NAME}:${IMAGE_TAG} docker.io/${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:develop
          docker tag ${IMAGE_NAME}:${IMAGE_TAG} docker.io/${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:latest

      - name: Push Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          docker push docker.io/${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:${IMAGE_TAG}
          docker push docker.io/${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:develop
          docker push docker.io/${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:latest
