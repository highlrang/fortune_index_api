name: Build and Push Docker Image

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: fortune-index-api
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Secrets stay as GitHub Actions environment variables.
      # This workflow builds and pushes the image only; it does not bake app secrets into the image.
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          docker build -t ${IMAGE_NAME}:${IMAGE_TAG} .
          docker tag ${IMAGE_NAME}:${IMAGE_TAG} docker.io/${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:${IMAGE_TAG}
          docker tag ${IMAGE_NAME}:${IMAGE_TAG} docker.io/${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:develop
          docker tag ${IMAGE_NAME}:${IMAGE_TAG} docker.io/${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:latest

      - name: Push Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          docker push docker.io/${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:${IMAGE_TAG}
          docker push docker.io/${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:develop
          docker push docker.io/${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:latest
