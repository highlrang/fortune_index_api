spring:
  datasource:
    url: jdbc:h2:mem:fortune_index;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  admin:
    emails:
      - dev@fortune-index.local
  dev:
    seed-user:
      enabled: true
      email: dev@fortune-index.local
      password: Dev1234!
      name: 개발용 계정
      birth-date: 1990-01-01
      birth-time: "12:00"
