spring.application.name=fortune_index

app.ai.provider=OPENAI
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.model=gpt-5-mini
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=gemini-2.5-flash

app.market.provider=YAHOO
app.market.fallback-sector=UNKNOWN
app.market.yahoo.base-url=https://query1.finance.yahoo.com
app.market.kis.app-key=${KIS_APP_KEY:}
app.market.kis.app-secret=${KIS_APP_SECRET:}

app.email.verification.base-url=${APP_EMAIL_VERIFICATION_BASE_URL:https://your-domain.com}
app.email.verification.verify-path=/email/verify
app.email.verification.success-fallback-url=${APP_EMAIL_VERIFICATION_SUCCESS_FALLBACK_URL:https://your-domain.com}
app.email.verification.deep-link-url=${APP_EMAIL_VERIFICATION_DEEP_LINK_URL:yourapp://verify-complete}
app.email.verification.from-address=${APP_EMAIL_VERIFICATION_FROM_ADDRESS:no-reply@your-domain.com}
app.email.verification.expiration-minutes=15

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
