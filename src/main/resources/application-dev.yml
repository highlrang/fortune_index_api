server:
  port: 7071
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/fortune_index?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1700000
      keepalive-time: 300000
  jpa:
    hibernate:
#      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  email:
    verification:
      base-url: https://voda.ppiyakworld.com
      success-fallback-url: https://voda.ppiyakworld.com/auth/verified
      password-reset-fallback-url: https://voda.ppiyakworld.com/password-reset
