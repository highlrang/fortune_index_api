spring:
  application:
    name: fortune_index
  profiles:
    default: h2
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_FROM_ADDRESS:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  admin:
    emails: ${ADMIN_EMAILS:}
  auth:
    jwt:
      issuer: fortune-index-api
      secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
      access-token-validity-minutes: 5
      refresh-token-validity-days: 14
  email:
    verification:
      app-name: fortune_index
      base-url: http://localhost:8080
      verify-path: /email/verify
      success-fallback-url: http://localhost:5173
      deep-link-url: yourapp://verify-complete
      password-reset-fallback-url: http://localhost:5173/password-reset
      password-reset-deep-link-url: yourapp://password-reset
      from-address: ${MAIL_FROM_ADDRESS:no-reply@fortune-index.local}
      expiration-minutes: 15
  ai:
    provider: OPENAI
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-2.5-flash
      connect-timeout: 3s
      read-timeout: 60s
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: gpt-5.1
      connect-timeout: 3s
      read-timeout: 60s

server:
  tomcat:
    uri-encoding: UTF-8
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
