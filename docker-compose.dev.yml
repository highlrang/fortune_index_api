services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fortune-index-api-dev
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DEV_DB_NAME:?DEV_DB_NAME is required}
      DB_USERNAME: ${DEV_DB_USERNAME:?DEV_DB_USERNAME is required}
      DB_PASSWORD: ${DEV_DB_PASSWORD:?DEV_DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@fortune-index.local}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      KIS_APP_KEY: ${KIS_APP_KEY:-}
      KIS_APP_SECRET: ${KIS_APP_SECRET:-}
    ports:
      - "8080:8080"
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: fortune-index-mysql-dev
    environment:
      MYSQL_DATABASE: ${DEV_DB_NAME:?DEV_DB_NAME is required}
      MYSQL_USER: ${DEV_DB_USERNAME:?DEV_DB_USERNAME is required}
      MYSQL_PASSWORD: ${DEV_DB_PASSWORD:?DEV_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DEV_DB_ROOT_PASSWORD:?DEV_DB_ROOT_PASSWORD is required}
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql-dev-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql-dev-data:
